spring.application.name=cc-payment
spring.jpa.open-in-view=false

spring.datasource.url=jdbc:h2:file:./data/cc-payment
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

payment.notification-secret=dev-notification-secret-change-me
payment.order-expiration=30m
payment.expiration-check-interval=60s
payment.merchant-notify.scan-interval=30s
payment.merchant-notify.request-timeout=5s
payment.merchant-notify.max-attempts=4
payment.merchant-notify.retry-intervals=1m,5m,15m
