spring.application.name=cc-payment
spring.jpa.open-in-view=false

spring.datasource.url=jdbc:h2:file:./data/cc-payment
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# 支付结果通知签名密钥，生产环境请通过环境变量 PAYMENT_NOTIFICATION_SECRET 覆盖
payment.notification-secret=${PAYMENT_NOTIFICATION_SECRET:dev-notification-secret}
