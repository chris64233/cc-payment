spring.application.name=cc-payment
spring.jpa.open-in-view=false

spring.datasource.url=jdbc:h2:file:./data/cc-payment
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

payment.notification-secret=dev-notification-secret-change-me

# 支付单有效期（创建后超过该时长未支付将被置为 EXPIRED）
payment.order-validity=30m
# 到期支付单扫描任务的执行间隔
payment.expiration-scan-interval=60s
