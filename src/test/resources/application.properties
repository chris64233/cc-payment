spring.datasource.url=jdbc:h2:mem:cc-payment-test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

payment.notification-secret=test-notification-secret

# 测试中通过直接调用过期处理服务触发，避免定时任务干扰
payment.expiration-scan-interval=24h
