spring.datasource.url=jdbc:h2:mem:cc-payment-test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

payment.notification-secret=test-notification-secret
# 测试中不依赖真实调度，到期处理由测试手动触发
payment.expiration-check-interval=24h
payment.merchant-notification-check-interval=24h
payment.merchant-notification-timeout=3s
